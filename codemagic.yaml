workflows:
  flutter-ios:
    name: Flutter iOS Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - flutter clean
      # 使用国内镜像源
      - export PUB_HOSTED_URL=https://pub.flutter-io.cn
      - export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
      # 带重试的 pub get
      - for i in 1 2 3; do flutter pub get --verbose && break || sleep 5; done
      # 检查 Podfile 是否存在，不存在则跳过
      - if [ -f "ios/Podfile" ]; then cd ios && pod install && cd ..; else echo "No Podfile found, skipping pod install"; fi
      - flutter build ios --release --no-codesign
    artifacts:
      # 明确指定要保存的产物
      - build/ios/iphoneos/Runner.app
      - build/ios/ipa/**/*.app
      - build/ios/**/*.app