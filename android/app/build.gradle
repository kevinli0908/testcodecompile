plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.omnidevices.flutter_bee_project'
    //compileSdk flutter.compileSdkVersion
    compileSdk 36  // 或 34，必须 >= 26
            ndkVersion flutter.ndkVersion

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                        targetCompatibility JavaVersion.VERSION_17
            }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId 'com.omnidevices.flutter_bee_project'
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.

        //minSdk = flutter.minSdkVersion
        //targetSdk = flutter.targetSdkVersion
        versionCode = 3
        versionName = '1.0.3'
        minSdk 26      // 可以保持 21
        targetSdk 36   // 建议 >= 26
    }

    signingConfigs {
        config {
            keyAlias 'omni'
            keyPassword 'omni1234'
            storeFile file("$rootDir/omniDevicesSign.jks")
            storePassword 'omni1234'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.config
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.config
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'org.jetbrains:annotations:15.0'
}
